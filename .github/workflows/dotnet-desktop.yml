name: Windows Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OptiCopy.Desktop.sln

      - name: Build
        run: dotnet build OptiCopy.Desktop.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Test
        run: dotnet test tests/OptiCopy.Tests/OptiCopy.Tests.csproj --configuration ${{ matrix.configuration }} --no-build

      - name: Publish x64 Release
        if: matrix.configuration == 'Release'
        run: dotnet publish src/OptiCopy.Windows/OptiCopy.Windows.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/publish/win-x64

      - name: Upload Windows build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: opticopy-windows-x64
          path: artifacts/publish/win-x64
